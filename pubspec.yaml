name: bookkeeping
description: "A GPL-3.0 licensed personal bookkeeping app (随手记账)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 本地存储（SQLite）
  sqflite: ^2.4.1
  # Windows/Linux 桌面端通过 FFI 使用 sqlite；配合 sqlite3_flutter_libs 免系统依赖
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  path_provider: ^2.1.4

  # 状态管理与基础工具
  provider: ^6.1.2
  collection: ^1.19.0
  intl: ^0.20.0
  shared_preferences: ^2.3.2
  file_selector: ^1.0.3
  # 备份 zip 打包（纯 Dart 实现，含图片附件归档）
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
