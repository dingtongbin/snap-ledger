name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 构建门禁：测试不过不发布。
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "tag=$TAG pubspec=$PUBSPEC"
          [ "$TAG" = "$PUBSPEC" ] || {
            echo "::error::tag v$TAG 与 pubspec.yaml 版本 $PUBSPEC 不一致"
            exit 1
          }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip release folder
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "snap-ledger-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: snap-ledger-${{ github.ref_name }}-windows-x64.zip

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "snap-ledger-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: snap-ledger-${{ github.ref_name }}.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snap-ledger-*.zip
            snap-ledger-*.apk
          generate_release_notes: true
