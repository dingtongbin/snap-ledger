<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 背景圆角矩形 = 账本/便签 -->
  <rect x="28" y="44" width="200" height="180" rx="36" ry="36"
        fill="#409EFF" fill-opacity="0.10"
        stroke="#409EFF" stroke-width="10" stroke-linejoin="round"/>

  <!-- 三条横向账目线 -->
  <line x1="68" y1="92"  x2="156" y2="92"  stroke="#409EFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="68" y1="128" x2="188" y2="128" stroke="#409EFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="68" y1="164" x2="140" y2="164" stroke="#409EFF" stroke-width="10" stroke-linecap="round"/>

  <!-- 右下角一个「对勾」 = 已记 / 余额正 -->
  <polyline points="148,182 176,210 224,158"
            fill="none" stroke="#409EFF" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右上角一支斜插的笔 = 随手记 -->
  <g transform="translate(196,32) rotate(35)">
    <rect x="-8" y="-44" width="16" height="58" rx="4"
          fill="#409EFF"/>
    <polygon points="-8,14 8,14 0,40"
             fill="#8A8D91"/>
    <rect x="-8" y="-50" width="16" height="10" rx="2"
          fill="#8A8D91"/>
  </g>
</svg>